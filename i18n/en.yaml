# Project chrome strings for the English edition.
#
# These name the parts of the page — running heads, index titles, page turns,
# the date format in the ledger. Article text is never translated by tooling
# (CONTEXT.md: Author translation); nothing here is article copy.
# The theme's hugo-paper i18n stays installed and supplies prev_page / next_page,
# which is why this file uses the same id/translation shape it does.

- id: chrome_contents
  translation: 'Contents'

# The header band's part label. Given a count it resolves the way
# chrome_records_unit does: `Record` for one record, `Records` for any other
# number — which is only ever asked on the title page.
- id: chrome_record
  translation:
    one: 'Record'
    other: 'Records'

- id: chrome_index
  translation: 'Index'

- id: chrome_profile
  translation: 'Profile'

- id: chrome_skip
  translation: 'Skip to contents'

- id: chrome_all_techniques
  translation: 'All techniques'

- id: chrome_years
  translation: 'Years'

- id: chrome_edition
  translation: 'Edition'

- id: chrome_edition_night
  translation: 'Night'

- id: chrome_theme_toggle
  translation: 'Switch between the day and night editions'

- id: chrome_engineering_notes
  translation: 'Engineering notes'

- id: chrome_imprint
  translation: 'Every article written and translated by hand'

- id: chrome_page_of
  translation: 'Page'

- id: chrome_date_format
  translation: '2006-01-02'

- id: chrome_record_switch
  translation: 'Read this record in'

- id: chrome_record_earlier
  translation: 'Earlier record'

- id: chrome_record_later
  translation: 'Later record'

- id: chrome_404
  translation: 'There is no record at this address.'

- id: chrome_colophon_built
  translation: 'Built with Hugo'

- id: chrome_colophon_icons
  translation: 'icons from hugo-paper'

- id: chrome_colophon_type
  translation: 'Set in Archivo Narrow'

- id: chrome_records_unit
  translation:
    one: ' record'
    other: ' records'
