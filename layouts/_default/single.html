{{ define "main" }}
    <article>
        <h1>{{ .Title }}</h1>
        <time>{{ .Date.Format "2006-01-02" }}</time>
        <hr>
        {{ .Content }}
        <hr>
        {{ with .Params.tags }}
        <div class="tags">
            {{ range . }}
            <a href="/tags/{{ . | urlize }}/">#{{ . }}</a>
            {{ end }}
        </div>
        {{ end }}
    </article>
{{ end }}
