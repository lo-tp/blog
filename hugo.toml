# The published origin. `hugo` (and `hugo server` without `-b`) builds with this, which is
# what deploy.sh publishes. For any local preview — `hugo server`, `python -m http.server`
# over public/, impeccable live mode — override it (`hugo server -b http://127.0.0.1:1313/`)
# or rebuild public/ with `hugo -b http://127.0.0.1:8090/`; otherwise every asset URL in the
# served page is absolute and cross-origin, so the stylesheet and the display face come from
# the deployed site rather than the code you are editing — see "The preview trap" in AGENTS.md.
baseURL = "https://blog.lotp.xyz/"
title = "Lotp's Blog"
DefaultContentLanguage = "en"
# English stays at / ; Chinese is served under /zh/ . No Accept-Language redirects:
# the language switch is explicit. See docs/adr/0001-hugo-i18n-with-zh-language-key.md
defaultContentLanguageInSubdir = false
enableInlineShortcodes = true

theme = "hugo-paper"

[params]
  author = "lotp"
  name = "Lotp"
  bio = "Every Day in Life Is a First Time"
  avatar = "https://blog.lotp.xyz/portrait.jpeg"
  github = "lo-tp"
  twitter = "lo__tp"
  linkedin = "shiqi-yang-6bbb73127"
  # The meta description of a non-article page. It states only what the site
  # actually is; there are no readership numbers or claims to put here.
  description = "First-hand engineering notes by lotp: problems solved, the code that ran, and the decisions kept. English and Simplified Chinese."

# `zh` means Simplified Chinese. The key must be exactly `zh`: hugo-paper ships
# i18n/zh.yaml and Hugo does not fall back to it from `zh-cn`. A Traditional
# edition would later be a separate `zh-hant` language with its own i18n files.
[languages.en]
locale = "en"
label = "English"
weight = 1

# The Chinese edition's own chrome, per PRODUCT.md: /zh/ stops inheriting the
# English title, bio and description. The wording below is DRAFTED BY THE TOOL
# for the author's approval — it is site chrome, not a translation of an article,
# and PRODUCT.md says the author owns it. Replace any line you would not write.
[languages.zh]
locale = "zh"
label = "中文"
weight = 2
title = "Lotp 的工程记录"

[languages.zh.params]
  bio = "生活中的每一天，都是第一次。"
  description = "一个人的工程记录：解决过的问题、跑过的代码、做下的决定。英文与简体中文双语。"

[pagination]
  pagerSize = 10

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

  # Code is the content of this site as much as prose is. With noClasses the
  # highlighter emits token classes instead of inline colours, so assets/custom.css
  # owns what code looks like in the day edition and in the night one — the
  # inline-style default could not follow a reader into either.
  [markup.highlight]
    codeFences = true
    guessFences = false
    noClasses = false
    lineNos = false
    tabWidth = 2
    style = "monokai"
