baseURL = "http://blog.lotp.xyz"
title = "Lotp's Blog"
languageCode = "en"
DefaultContentLanguage = "en"
enableInlineShortcodes = true

theme = "hugo-paper"

[params]
  author = "lotp"
  name = "Lotp"
  bio = "Every Day in Life Is a First Time"
  avatar = "portrait.svg"
  github = "lo-tp"

[pagination]
  pagerSize = 10

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
