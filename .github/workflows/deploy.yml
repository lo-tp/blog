name: Deploy to GitHub Pages

on:
  push:
    branches: [master]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Hugo
        run: |
          wget -q https://github.com/gohugoio/hugo/releases/download/v0.166.0/hugo_0.166.0_linux-amd64.tar.gz
          tar xzf hugo_0.166.0_linux-amd64.tar.gz hugo

      - name: Build
        run: ./hugo

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PAGES_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Push to Pages repo
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git clone git@github.com:lo-tp/lo-tp.github.io.git /tmp/pages
          rm -rf /tmp/pages/*
          cp -r public/* /tmp/pages/
          cd /tmp/pages
          git add --all
          git commit -m "deploy: $(date +%Y-%m-%dT%H:%M:%S)" || exit 0
          git push origin master
